[project]
name = "usos-mcp"
version = "0.3.3"
description = "MCP server for USOS (Uniwersytecki System Obsługi Studiów)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=3.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "ruff>=0.15.14",
]

[project.scripts]
server = "usos.core:main"

[tool.uv]
package = true
